name: Bug report
description: Report a reproducible problem with Nitpick.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Please remove credentials, private logs, and proprietary source code before submitting.
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: "0.1.0 or e71b3b7"
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: "3.13"
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Include the smallest sanitized configuration or fixture that demonstrates the issue.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
