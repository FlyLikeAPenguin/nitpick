<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">Nitpick — incident triage for developers</title>
  <desc id="desc">Datadog errors become Claude root-cause analysis and reviewable pull requests.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f85149"/>
      <stop offset="0.5" stop-color="#58a6ff"/>
      <stop offset="1" stop-color="#3fb950"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#30363d" stroke-width="1" opacity="0.34"/>
    </pattern>
  </defs>
  <rect width="1280" height="640" rx="28" fill="url(#background)"/>
  <rect x="36" y="36" width="1208" height="568" rx="20" fill="url(#grid)" opacity="0.65"/>
  <circle cx="1050" cy="120" r="190" fill="#1f6feb" opacity="0.08"/>
  <circle cx="1140" cy="520" r="250" fill="#238636" opacity="0.08"/>

  <g transform="translate(100 162)">
    <rect width="70" height="70" rx="16" fill="#f85149" opacity="0.18" stroke="#f85149" stroke-width="2"/>
    <path d="M35 14v25M35 53v3" stroke="#ff7b72" stroke-width="8" stroke-linecap="round"/>
    <path d="M35 9 10 56h50L35 9Z" fill="none" stroke="#ff7b72" stroke-width="3" stroke-linejoin="round"/>
  </g>
  <g transform="translate(455 162)">
    <rect width="70" height="70" rx="16" fill="#58a6ff" opacity="0.18" stroke="#58a6ff" stroke-width="2"/>
    <circle cx="31" cy="31" r="17" fill="none" stroke="#79c0ff" stroke-width="4"/>
    <path d="m44 44 14 14" stroke="#79c0ff" stroke-width="5" stroke-linecap="round"/>
  </g>
  <g transform="translate(810 162)">
    <rect width="70" height="70" rx="16" fill="#3fb950" opacity="0.18" stroke="#3fb950" stroke-width="2"/>
    <path d="m16 36 13 13 27-29" fill="none" stroke="#56d364" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <path d="M175 197H455M525 197H810" stroke="url(#flow)" stroke-width="5" stroke-linecap="round" filter="url(#glow)"/>
  <path d="M430 184l25 13-25 13M780 184l25 13-25 13" fill="none" stroke="#8b949e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <text x="100" y="344" fill="#f0f6fc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="88" font-weight="800" letter-spacing="8">NITPICK</text>
  <text x="106" y="404" fill="#8b949e" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="30" font-weight="500">Datadog errors → Claude RCA → reviewable PRs</text>
  <text x="106" y="490" fill="#58a6ff" font-family="SFMono-Regular,Consolas,monospace" font-size="20">SAFE BY DEFAULT  •  LOCAL DASHBOARD  •  OPEN SOURCE</text>
  <rect x="106" y="532" width="350" height="4" rx="2" fill="url(#flow)"/>
</svg>
